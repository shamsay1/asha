<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Land Valuation System</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="all_page">

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Land Valuation System</h1>
      <p>Karume Institute of Science and Technology</p>
    </div>
    <h2>Login to your Account</h2>

    <div id="alertContainer"></div>

  
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <div class="auth-switch">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  // Demo account auto-fill
  document.querySelectorAll('[data-demo]').forEach(el => {
    el.addEventListener('click', () => {
      document.getElementById('loginEmail').value = el.dataset.demo;
      document.getElementById('loginPassword').value = '1234';
    });
  });

  // Login form submit
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const alertBox = document.getElementById('alertContainer');

    const data = await apiPost('login.php', { email, password });
    if (data.success) {
      window.location.href = 'dashboard.html';
    } else {
      showAlert(alertBox, 'error', data.message || 'Login failed.');
    }
  });

  // If already logged in, redirect
  apiGet('get_current_user.php').then(d => {
    if (d.success) window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
