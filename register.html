<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Land Valuation System</title>
  <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <style>
  .custom-auth-card{
    max-width: 900px;
    width: 100%;
    padding: 35px;
    border-radius: 20px;
    background: #fff;
    margin: auto;
}

.custom-auth-card .form-control,
.custom-auth-card .form-select{
    height: 50px;
    border-radius: 12px;
}

.custom-auth-card .btn{
    border-radius: 12px;
    font-weight: 600;
}
 </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card custom-auth-card">

    <!-- Logo -->
    <div class="auth-logo text-center mb-3">

        <h1 class="mb-1">
            Land Valuation System
        </h1>

        <p class="text-muted">
            Create your account
        </p>

    </div>

    <div id="alertContainer" style="color: red"></div>

    <form id="registerForm">

        <!-- ROW 1 -->
        <div class="row">

            <!-- Full Name -->
            <div class="col-md-6 mb-1">

                <label class="form-label">
                    Full Name
                </label>

                <input type="text"
                       id="regName"
                       class="form-control"
                       placeholder="Enter full name"
                       required>

            </div>

            <!-- Email -->
            <div class="col-md-6 mb-1">

                <label class="form-label">
                    Email
                </label>

                <input type="email"
                       id="regEmail"
                       class="form-control"
                       placeholder="Enter email address"
                       required>

            </div>

        </div>

        <!-- ROW 2 -->
        <div class="row">

            <!-- Phone -->
            <div class="col-md-6 mb-1">

                <label class="form-label">
                    Phone
                </label>

                <input type="text"
                       id="regPhone"
                       class="form-control"
                       placeholder="+255 712 345 678"
                       required>

            </div>

            <!-- Password -->
            <div class="col-md-6 mb-1">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       id="regPassword"
                       class="form-control"
                       placeholder="Enter password"
                       required>

            </div>

        </div>

        <!-- ROW 3 -->
        <div class="row">

            <!-- Confirm Password -->
            <div class="col-md-12 mb-1">

                <label class="form-label">
                    Confirm Password
                </label>

                <input type="password"
                       id="regConfirmPassword"
                       class="form-control"
                       placeholder="Confirm password"
                       required>

            </div>

            <!-- Account Type -->
            <!-- <div class="col-md-6 mb-3">

                <label class="form-label">
                    Account Type
                </label>

                <select id="regRole"
                        class="form-select"
                        required>

                    <option value="">
                        Choose type...
                    </option>

                    <option value="seller">
                        Seller
                    </option>

                    <option value="buyer">
                        Buyer
                    </option>

                </select>

            </div> -->
            <input type="hidden"
                       id="regRole"
                       class="form-control"
                       value="buyer"
                       >

        </div>

        <!-- Info -->
        <small class="text-muted d-block mb-4">
            Authority and Administrator accounts can only be created
            by an existing Administrator.
        </small>

        <!-- Button -->
        <button type="submit"
                class="btn btn-primary w-100 py-2">

            Create Account

        </button>

    </form>

    <!-- Switch -->
    <div class="auth-switch text-center mt-4">

        Already have an account?
        <a href="index.html">
            Log in
        </a>

    </div>

</div>
</div>

<script src="js/app.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('regConfirmPassword').value;
     if (password !== confirmPassword) {
        alert('Passwords do not match.');
        return;
    }
    const alertBox = document.getElementById('alertContainer');
    const payload = {
      name:     document.getElementById('regName').value.trim(),
      email:    document.getElementById('regEmail').value.trim(),
      phone:    document.getElementById('regPhone').value.trim(),
      password: document.getElementById('regPassword').value,
      role:     document.getElementById('regRole').value
    };
    const data = await apiPost('register.php', payload);
    if (data.success) {
      window.location.href = data.redirect;
      alert("registration completed");
    } else {
      showAlert(alertBox, 'error', data.message || 'Registration failed.');
    }
  });
</script>
</body>
</html>
