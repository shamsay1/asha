<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Land — Land Valuation System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div id="app">
  
</div>

<div>
<script src="js/app.js"></script>


<script>
(async () => {
  const user = await requireAuth(['seller']);
  if (!user) return;

  document.getElementById('app').innerHTML = renderLayout(user, 'add_land.html', 'Add New Land');
  attachLogoutHandler();

  const content = document.getElementById('pageContent');
  content.innerHTML = `
  <div class="card">
    <div class="page-header">
      <h1>Add New Land</h1>
      <p>Provide accurate details — they directly affect the valuation calculated by the Authority.</p>
    </div>
    <div id="alertContainer"></div>
    <div class="card">
      <form id="addLandForm" enctype="multipart/form-data">
        <div class="form-group">
          <label>Land Title</label>
          <input type="text" id="alTitle" placeholder="e.g. Residential Plot near Stone Town" required>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Plot Number</label>
            <input type="text" id="alPlot" placeholder="ZNZ/XXX/0000" required>
          </div>
          <div class="form-group">
            <label>Location (area / district)</label>
            <input type="text" id="alLocation" placeholder="e.g. Stone Town, Zanzibar" required>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Zone</label>
            <select id="alZone" required>
              <option value="urban">Urban (town)</option>
              <option value="suburban">Suburban</option>
              <option value="rural">Rural / village</option>
            </select>
          </div>
          <div class="form-group">
            <label>Land Type</label>
            <select id="alType" required>
              <option value="residential">Residential (house plot)</option>
              <option value="commercial">Commercial (business)</option>
              <option value="agricultural">Agricultural (farm)</option>
            </select>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Area (square meters)</label>
            <input type="number" id="alArea" min="1" step="0.01" required>
          </div>
          <div class="form-group">
  <label>Image</label>
  <input type="file" id="image" accept="image/*" required>
</div>
          <div class="form-group">
            <label>Road Access</label>
            <select id="alRoadAccess" required>
              <option value="main">Main road frontage</option>
              <option value="side">Side road access</option>
              <option value="interior">Interior (no direct road)</option>
            </select>
          </div>
        </div>

        <div id="resCommFields">
          <div class="form-group">
            <label>Distance to City Center / Market</label>
            <select id="alDistance">
              <option value="near">Near (under 2 km)</option>
              <option value="moderate">Moderate (2–10 km)</option>
              <option value="far">Far (over 10 km)</option>
            </select>
          </div>
        </div>

        <div id="agriFields" style="display:none;">
          <div class="grid-2">
            <div class="form-group">
              <label>Soil Quality</label>
              <select id="alSoil">
                <option value="fertile">Fertile</option>
                <option value="moderate">Moderate</option>
                <option value="poor">Poor</option>
              </select>
            </div>
            <div class="form-group">
              <label>Water Source</label>
              <select id="alWaterSource">
                <option value="river">River / lake nearby</option>
                <option value="well">Well / borehole</option>
                <option value="none">No water source</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="alDesc" rows="3" placeholder="Brief description of the land"></textarea>
        </div>
        <div class="form-group">
          <label>Available Utilities (tick what applies)</label>
          <div style="display:flex; flex-wrap:wrap; gap:15px; margin-top:6px;">
            <label><input type="checkbox" id="alElectricity"> Electricity</label>
            <label><input type="checkbox" id="alWater"> Water</label>
            <label><input type="checkbox" id="alRoad"> Road access</label>
            <label><input type="checkbox" id="alSewage"> Sewage</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Submit for Valuation</button>
      </form>
    </div>
    </div>
  `;

  // Toggle type-specific fields
  const typeSel = document.getElementById('alType');
  const toggleFields = () => {
    const isAgri = typeSel.value === 'agricultural';
    document.getElementById('resCommFields').style.display = isAgri ? 'none' : '';
    document.getElementById('agriFields').style.display    = isAgri ? '' : 'none';
  };
  typeSel.addEventListener('change', toggleFields);
  toggleFields();

document.getElementById('addLandForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const formData = new FormData();

  formData.append('title', document.getElementById('alTitle').value.trim());
  formData.append('plotNumber', document.getElementById('alPlot').value.trim());
  formData.append('location', document.getElementById('alLocation').value.trim());
  formData.append('zone', document.getElementById('alZone').value);
  formData.append('type', typeSel.value);
  formData.append('area', document.getElementById('alArea').value);
  formData.append('roadAccess', document.getElementById('alRoadAccess').value);

  formData.append('description', document.getElementById('alDesc').value.trim());

  formData.append('image', document.getElementById('image').files[0]); 

  formData.append('utilities', JSON.stringify({
    electricity: document.getElementById('alElectricity').checked,
    water: document.getElementById('alWater').checked,
    road: document.getElementById('alRoad').checked,
    sewage: document.getElementById('alSewage').checked
  }));

  if (typeSel.value === 'agricultural') {
    formData.append('soilQuality', document.getElementById('alSoil').value);
    formData.append('waterSource', document.getElementById('alWaterSource').value);
  } else {
    formData.append('distanceToCenter', document.getElementById('alDistance').value);
  }

  const res = await fetch('php/add_land.php', {
    method: 'POST',
    body: formData,
    credentials: 'same-origin'
  });

  const data = await res.json();

  if (data.success) {
    window.location.href = 'land_list.html';
  } else {
    showAlert(document.getElementById('alertContainer'), 'error', data.message);
  }
});
})();
</script>

</div>

</body>
</html>
